version: 2
updates:
  # GitHub Actions — keep workflow action pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Brussels
    target-branch: main
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
    labels:
      - "📦 Type: Dependency"
      - "🧩 Area: CI"
      - "🤖 Source: Dependabot"
      - "⏱️ Effort: Small"

  # Swift Package Manager — activates once Package.swift lists remote deps.
  # Dependabot only opens PRs when there is something to update.
  - package-ecosystem: swift
    directory: /BlinkoApp
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Brussels
    target-branch: main
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "📦 Type: Dependency"
      - "🤖 Source: Dependabot"
      - "⏱️ Effort: Small"
