name: Triage

# Auto-label PRs from labeler.yml and normalize titles to conventional-commit style.
# Manual re-triage: comment `/triage` on a PR (OWNER/MEMBER only).

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

env:
  MANUAL_TRIAGE_COMMAND: /triage
  MANUAL_TRIAGE_ALLOWED_ASSOCIATIONS: '["OWNER","MEMBER"]'

jobs:
  triage-gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      manual_triage_requested: ${{ steps.gate.outputs.manual_triage_requested }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          HAS_PULL_REQUEST: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
          TRIAGE_COMMAND: ${{ env.MANUAL_TRIAGE_COMMAND }}
          ALLOWED_ASSOCIATIONS: ${{ env.MANUAL_TRIAGE_ALLOWED_ASSOCIATIONS }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const commandBoundary = new RegExp(
            "^" + process.env.TRIAGE_COMMAND.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\s|$)",
          );
          const requested =
            process.env.EVENT_NAME === "issue_comment" &&
            commandBoundary.test(process.env.COMMENT_BODY) &&
            process.env.HAS_PULL_REQUEST === "true" &&
            JSON.parse(process.env.ALLOWED_ASSOCIATIONS).includes(process.env.AUTHOR_ASSOCIATION);

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `manual_triage_requested=${requested}\n`,
          );
          EOF

  label:
    needs: triage-gate
    if: github.event_name == 'pull_request_target' || needs.triage-gate.outputs.manual_triage_requested == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target checks out the base ref; labeler only needs
          # labeler.yml from the base branch (safe for fork PRs).
          persist-credentials: false
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Preserves manually-applied taxonomies (Type, Priority, Effort, Platform).
          sync-labels: false

  normalize-title:
    needs: triage-gate
    if: github.event_name == 'issues' || (github.event_name == 'pull_request_target' && github.event.action != 'synchronize') || needs.triage-gate.outputs.manual_triage_requested == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Normalize title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MANUAL_TRIAGE_COMMAND: ${{ env.MANUAL_TRIAGE_COMMAND }}
          MANUAL_TRIAGE_ALLOWED_ASSOCIATIONS: ${{ env.MANUAL_TRIAGE_ALLOWED_ASSOCIATIONS }}
        with:
          script: |
            const ccTypes = [
              "feat", "fix", "docs", "style", "refactor", "perf",
              "test", "chore", "ci", "build", "revert",
            ];
            const triageCommand = process.env.MANUAL_TRIAGE_COMMAND;
            const authorizedAssociations = JSON.parse(
              process.env.MANUAL_TRIAGE_ALLOWED_ASSOCIATIONS
            );
            const commandBoundary = new RegExp(
              "^" + triageCommand.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\s|$)"
            );

            const emojiPoolByType = {
              feat: ["✨", "🎉", "🚀", "💡", "🌟"],
              fix: ["🩹", "🔒", "🐛", "🚑", "💊"],
              docs: ["📝", "📖", "📚", "🗒️", "✍️"],
              style: ["🎨", "💄", "✏️", "🖌️", "💅"],
              refactor: ["♻️", "🔄", "🧱", "🏗️", "🔨"],
              perf: ["⚡️", "🚀", "🏎️", "💨", "⏱️"],
              test: ["✅", "🧪", "🔍", "🧬", "🎯"],
              chore: ["🧹", "🔧", "🗑️", "📦", "🛠️"],
              ci: ["🤖", "⚙️", "🔁", "🏭", "🔌"],
              build: ["🏗️", "📦", "🔨", "🧱", "⚒️"],
              revert: ["⏪", "↩️", "🔙", "♻️", "🔄"],
            };

            const randomEmoji = (type) => {
              const pool = emojiPoolByType[type];
              return pool[Math.floor(Math.random() * pool.length)];
            };

            const { owner, repo } = context.repo;
            let issue = context.payload.pull_request ?? context.payload.issue;
            if (context.eventName === "issue_comment") {
              const isAuthorizedTriageComment =
                Boolean(context.payload.comment?.body) &&
                commandBoundary.test(context.payload.comment.body) &&
                context.payload.issue?.pull_request &&
                authorizedAssociations.includes(context.payload.comment.author_association);
              if (!isAuthorizedTriageComment) {
                core.info("Unauthorized or unsupported triage comment; skipping.");
                return;
              }

              try {
                const response = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: context.payload.issue.number,
                });
                issue = response.data;
              } catch (error) {
                core.setFailed(`Failed to load issue/PR #${context.payload.issue.number}: ${error.message}`);
                return;
              }
            }
            if (!issue) {
              core.info("No issue or pull_request payload found; skipping.");
              return;
            }

            const originalTitle = issue.title.trim();
            if (!originalTitle) {
              core.info("Empty title; skipping.");
              return;
            }

            const exactPattern = new RegExp(
              `^[^\\x20-\\x7E][^\\x20-\\x7E]* (${ccTypes.join("|")})(\\([^)]+\\))?(!)?: .*\\S$`,
              "u",
            );
            if (exactPattern.test(originalTitle)) {
              core.info(`Title already matches convention: "${originalTitle}"`);
              return;
            }

            const lowerFirst = (value) =>
              value.length === 0 ? value : value[0].toLowerCase() + value.slice(1);

            const sentenceCase = (value) =>
              value
                .replace(/\s+/g, " ")
                .trim()
                .replace(/[.。!！?？]+$/u, "");

            const guessType = (title) => {
              const normalized = title.toLowerCase();
              if (/\b(ci|workflow|github action|actions|pipeline)\b/.test(normalized)) return "ci";
              if (/\b(build|release|bundle|compile|packag|xcode)\b/.test(normalized)) return "build";
              if (/\b(test|spec|coverage|xcresult)\b/.test(normalized)) return "test";
              if (/\b(readme|doc|docs|documentation|guide|roadmap)\b/.test(normalized)) return "docs";
              if (/\b(refactor|cleanup|clean up|rename|reorganize)\b/.test(normalized)) return "refactor";
              if (/\b(perf|performance|speed|faster|optimi[sz]e)\b/.test(normalized)) return "perf";
              if (/\b(style|format|lint|swiftformat|swiftlint)\b/.test(normalized)) return "style";
              if (/\b(fix|bug|error|issue|broken|hotfix|repair|crash)\b/.test(normalized)) return "fix";
              if (/\b(add|create|implement|introduce|support|enable|allow)\b/.test(normalized)) return "feat";
              return "chore";
            };

            const plainCcPattern = new RegExp(
              `^(${ccTypes.join("|")})(\\([^)]+\\))?(!)?:\\s+(.+?)\\s*$`,
              "i",
            );

            const prefixedCcPattern = new RegExp(
              `^[^\\w\\s]+\\s*(${ccTypes.join("|")})(\\([^)]+\\))?(!)?:\\s+(.+?)\\s*$`,
              "iu",
            );

            let nextTitle;
            const plainCcMatch = originalTitle.match(plainCcPattern);
            if (plainCcMatch) {
              const [, type, scope = "", bang = "", description] = plainCcMatch;
              const normalizedType = type.toLowerCase();
              nextTitle = `${randomEmoji(normalizedType)} ${normalizedType}${scope}${bang}: ${sentenceCase(description)}`;
            } else {
              const prefixedCcMatch = originalTitle.match(prefixedCcPattern);
              if (prefixedCcMatch) {
                const [, type, scope = "", bang = "", description] = prefixedCcMatch;
                const normalizedType = type.toLowerCase();
                nextTitle = `${randomEmoji(normalizedType)} ${normalizedType}${scope}${bang}: ${sentenceCase(description)}`;
              } else {
                const inferredType = guessType(originalTitle);
                const description = lowerFirst(sentenceCase(originalTitle));
                nextTitle = `${randomEmoji(inferredType)} ${inferredType}: ${description}`;
              }
            }

            if (nextTitle === originalTitle) {
              core.info("Normalization produced no change; skipping update.");
              return;
            }

            core.info(`Updating title from "${originalTitle}" to "${nextTitle}"`);

            if (issue.pull_request) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: issue.number,
                title: nextTitle,
              });
            } else {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                title: nextTitle,
              });
            }
