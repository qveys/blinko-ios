name: Triage

# Path-based PR labels via actions/labeler.
# Title normalization lives in normalize-titles.yml (no duplication).
# Manual re-triage: comment `/triage` on a PR (OWNER/MEMBER only).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

env:
  MANUAL_TRIAGE_COMMAND: /triage
  MANUAL_TRIAGE_ALLOWED_ASSOCIATIONS: '["OWNER","MEMBER"]'

concurrency:
  group: triage-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  triage-gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      manual_triage_requested: ${{ steps.gate.outputs.manual_triage_requested }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          HAS_PULL_REQUEST: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
          TRIAGE_COMMAND: ${{ env.MANUAL_TRIAGE_COMMAND }}
          ALLOWED_ASSOCIATIONS: ${{ env.MANUAL_TRIAGE_ALLOWED_ASSOCIATIONS }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const commandBoundary = new RegExp(
            "^" + process.env.TRIAGE_COMMAND.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\s|$)",
          );
          const requested =
            process.env.EVENT_NAME === "issue_comment" &&
            commandBoundary.test(process.env.COMMENT_BODY) &&
            process.env.HAS_PULL_REQUEST === "true" &&
            JSON.parse(process.env.ALLOWED_ASSOCIATIONS).includes(
              process.env.AUTHOR_ASSOCIATION,
            );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `manual_triage_requested=${requested}\n`,
          );
          EOF

  label:
    name: Label PR by paths
    needs: triage-gate
    if: >
      github.event_name == 'pull_request_target' ||
      needs.triage-gate.outputs.manual_triage_requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # pull_request_target checks out the base branch by default — correct for
      # labeler.yml trust boundary (config from main, not the PR fork).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Removes obsolete Area labels from labeler.yml. Labels outside
          # labeler.yml (Type, Priority, Effort, Platform, …) stay manual.
          sync-labels: true
