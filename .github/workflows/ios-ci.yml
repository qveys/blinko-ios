name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same PR/branch — the newest push is the only
# one whose result matters, and macOS runner minutes are expensive.
concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The pipeline only reads code and publishes check results.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Build (iOS Simulator)
        run: ./scripts/ci-build.sh

      - name: Run unit tests
        run: ./scripts/ci-test.sh

      # Logs and the .xcresult bundle are the only way to debug a red run after
      # the runner is destroyed, so retain them regardless of outcome.
      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ci-results
          path: |
            build/ci/*.log
            build/ci/TestResults.xcresult
          retention-days: 14
          if-no-files-found: warn
